[project]
name = "orinoco-forecast"
version = "0.1.0"
description = "Time-series forecasting scaffold for Orinoco river levels"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "matplotlib>=3.11.2",
    "mlforecast>=1.1.0",
    "neuralforecast>=3.3.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0,<6",
    "pmdarima>=2.1.1",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsforecast>=2.1.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "utilsforecast>=0.2.17",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
timesfm = [
    "timesfm[torch]>=3.0.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
