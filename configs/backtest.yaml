# Shared chronological protocol; models must not shuffle time-series rows.
# Input window lengths are per-model hyperparameters (configs/models/).
source: orinoco_stations
horizon: 14 # Daily forecast horizon, shared by every model.
step_size: 30 # Days between consecutive cross-validation cutoffs.
n_windows: 24 # Rolling-origin windows evaluated before test_start.
test_start: "2023-01-01" # Held-out test period; never used for model selection.
seasonality: 365 # SeasonalNaive period (MASE is horizon-matched, not seasonal).
# Shared input window for build_windows in the runner execution path. ML models
# may override it through their own config; statistical runners ignore it.
input_length: 28
# Train once per model on the data before the first cutoff and roll forward over
# the windows. Same policy for every model (fairness) and 24x cheaper for neural
# models than refitting per window.
refit: false
# Hyperparameter tuning (evaluation/tuning.py): 12 windows that end at the first
# VALIDATION cutoff, so hyperparameters are chosen without seeing the 24 windows
# (2021-2022) that compare models, and never the final test. step_size is 23,
# not 30: the target has an imputed gap 2020-03-25..2020-04-12 and the leakage
# guard forbids cutoffs within `horizon` days of imputed rows; 12 x 30 days back
# from the first validation cutoff always hits it. 12 x 23 spans 2020-05-04 to
# 2021-01-26 (rising limb, peak and recession) and windows still do not overlap.
tuning:
  n_windows: 12
  step_size: 23
