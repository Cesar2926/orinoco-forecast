# Raw inputs are immutable. Paths are relative to the repository root.
# Forecast targets (unique_id values in the long table).
targets: [ciudad_bolivar, palua]

# Thresholds used by orinoco_forecast.data.quality.label_quality (metres, days).
quality:
  flat_min_days: 10 # Identical consecutive values for at least this many days.
  jump_max_m_per_day: 1.0 # Absolute day-over-day change above this is suspect.
  source_conflict_m: 0.3 # Only used when a reference source is passed (none now).

# Levels are read with TimeSeriesDataset.extract_levels (data/datasets.py): the
# first column is the date and the next four are the stations in river order.
# The workbook ends 2025-03-31, but rows after 2025-02-24 are empty.
# The 1930-2025 Ciudad Bolivar workbook was removed from data/raw/, so there is
# no reference source and label_quality never emits source_conflict.
sources:
  - name: orinoco_stations
    path: "data/raw/DATOS RIO ORINOCO.xlsx"
    sheet: "Entrenar"
    freq: D
    format: excel
    role: primary

exogenous:
  nasa_power:
    variable: PRECTOTCORR
    files:
      ayacucho: "data/external/nasa_power_ayacucho.csv"
      caicara: "data/external/nasa_power_caicara.csv"
      ciudad_bolivar: "data/external/nasa_power_ciudad_bolivar.csv"
      palua: "data/external/nasa_power_palua.csv"
  noaa_oni:
    path: "data/external/noaa_oni.ascii.txt"
    publication_lag_months: 3

# Model-ready frame built by orinoco_forecast.features.dataset.build_model_frame.
model_frame:
  upstream: [ayacucho, caicara] # Historical covariates (past values only).
  # Period accepted by the professor; data outside it is not used.
  start: "2009-01-01"
  end: "2024-12-31"
  max_gap_days: 31 # Longer null runs stay null (series is not invented).
  fourier_k: 3 # sin/cos pairs for the annual cycle.
  fourier_period: 365.25 # Days.

# Leakage-safe features written by TimeSeriesDataset.write_parquet.
# A feature dated t only reads a source dated t - lag. ARIMAX consumes only
# lags >= min_exog_lag, so every future exog value is observed at the cutoff.
features:
  river_order: [ayacucho, caicara, ciudad_bolivar, palua]
  min_exog_lag: 14
  # <station>_lag_<n>: level at t - n. Only these stations get lag columns.
  station_lags:
    ayacucho: [7, 14]
    caicara: [4]
    ciudad_bolivar: [1]
  # d_<station>_lag_<n>: day-over-day change at t - n.
  diff_lags:
    ayacucho: [3]
    caicara: [3]
    ciudad_bolivar: [1]
  rain_lags: [14, 21, 28]
  oni_lags: [0, 30, 60]
  calendar_terms: 0 # 0 = no sin_doy/cos_doy columns.
