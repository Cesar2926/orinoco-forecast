# Raw inputs are immutable. Paths are relative to the repository root.
# Forecast targets (unique_id values in the long table).
targets: [ciudad_bolivar, palua]

# Thresholds used by orinoco_forecast.data.quality.label_quality (metres, days).
quality:
  flat_min_days: 10 # Identical consecutive values for at least this many days.
  jump_max_m_per_day: 1.0 # Absolute day-over-day change above this is suspect.
  source_conflict_m: 0.3 # Primary vs historical Ciudad Bolivar disagreement.

sources:
  - name: orinoco_stations
    path: "data/raw/Niveles Orinoco.xlsx"
    sheet: "Niveles PC CO CB P"
    date_column: fecha
    target_column: ciudad_bolivar
    freq: D
    covariates: [ayacucho, caicara, palua]
    format: excel
    role: primary

  # This file's .xls suffix is retained, but its payload is CSV, not a workbook.
  # It is an exact duplicate of orinoco_stations in the audited worktree.
  - name: orinoco_stations_csv_export
    path: "data/raw/dataset_imputado_simpleml.csv.xls"
    sheet: null
    date_column: fecha
    target_column: ciudad_bolivar
    freq: D
    covariates: [ayacucho, caicara, palua]
    format: csv
    date_format: "%Y/%m/%d"
    duplicate_of: orinoco_stations
    role: duplicate # Not loaded by the pipeline.

  # NIVELES stores years in columns and month/day in rows. The loader reshapes
  # only these value columns in memory, never rewrites the workbook.
  # Extends Ciudad Bolivar to 2025-12-31 and serves as conflict reference.
  - name: ciudad_bolivar_historical
    path: "data/raw/Niveles Del Orinoco Est. Ciudad Bolivar 1930-2025.xlsx"
    sheet: NIVELES
    date_column: fecha
    target_column: nivel_m
    unique_id: ciudad_bolivar # Station name used in the long table.
    freq: D
    format: excel
    layout: wide_years
    role: historical
    date_parts:
      month_column: MES
      day_column: "DIA DEL MES"
      year_column_pattern: "^(19|20)\\d{2}$"
      first_year: 1930
      last_year: 2025
      month_mapping:
        ENE: 1
        FEB: 2
        MAR: 3
        ABR: 4
        MAY: 5
        JUN: 6
        JUL: 7
        AGO: 8
        SEP: 9
        OCT: 10
        NOV: 11
        DIC: 12

exogenous:
  nasa_power:
    variable: PRECTOTCORR
    files:
      ayacucho: "data/external/nasa_power_ayacucho.csv"
      caicara: "data/external/nasa_power_caicara.csv"
      ciudad_bolivar: "data/external/nasa_power_ciudad_bolivar.csv"
      palua: "data/external/nasa_power_palua.csv"
  noaa_oni:
    path: "data/external/noaa_oni.ascii.txt"
    publication_lag_months: 3
