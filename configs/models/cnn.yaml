# TCN via neuralforecast 3.3.0 (models/neural/cnn.py). The protocol (horizon,
# step_size, n_windows, refit) lives only in configs/backtest.yaml.

# Architecture. Receptive field = 1 + (kernel_size - 1) * sum(dilations) = 32 days;
# the runner rejects input_size below it (part of the net would see no data).
# Target: "level" models y directly; "difference" models y_t - y_{t-1}, adds the
# current level as historical covariate level_y and rebuilds levels from the
# level at the cutoff (persistence becomes the zero prediction).
target_transform: difference # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio
input_size: 112 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio
# (~1 month lead of the floodplain x4; 28/56/112 searched).
kernel_size: 2 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio (sin cambio)
dilations: [1, 2, 4, 8, 16] # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio (sin cambio)
encoder_hidden_size: 32 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio
# (filters per causal convolution layer).
decoder_hidden_size: 64
decoder_layers: 2

# Optimisation. MAE loss matches the selection metric; the robust scaler (median,
# IQR) is fitted per window on its input part, so floods do not distort it.
loss: MAE
learning_rate: 0.002656 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio
max_steps: 1000 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, objetivo rel_mae medio (sin cambio)
# Overridable with run_model.py --max-steps for smoke runs.
batch_size: 32 # Series per batch.
windows_batch_size: 128 # Training windows sampled per batch.
scaler_type: robust

# Early stopping on the last val_size days before the first cutoff; those days
# are not used to fit weights. Patience counts validation checks.
val_size: 365
val_check_steps: 50
early_stop_patience_steps: 5

# One model per seed on the same windows; columns TCN_s<seed>, reported as
# mean +- std across seeds (predictions are not averaged).
seeds: [1, 2, 3]

# PyTorch Lightning Trainer kwargs. The accelerator is chosen in code (gpu if
# CUDA is available, else cpu). deterministic "warn" keeps CUDA runs working.
trainer:
  enable_progress_bar: false
  enable_model_summary: false
  logger: false
  deterministic: warn
