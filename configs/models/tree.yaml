# XGBoost via mlforecast (orinoco_forecast.models.trees.tree.XGBoostRunner).
# Direct multi-step strategy: one model per horizon step (max_horizon = horizon
# from configs/backtest.yaml); recursive forecasting accumulates its own error
# (Ben Taieb et al. 2012). LightGBM is not included.
estimator: xgboost

# Target lags: daily inertia (1-3), weekly cycle (7) and the 2-8 week floodplain
# delay (14-56).
lags: [1, 2, 3, 7, 14, 21, 28, 56]
# RollingMean windows over lag 1: smooth daily noise (7) and last-month trend (30).
rolling_mean_windows: [7, 30]
# Model the daily change: trees cannot extrapolate beyond the training range, so
# predicting levels would cap record floods at the historical maximum.
target_differences: [1]

# Historical covariates (upstream stations, and rain/ONI in stage B) are shifted
# by these days before reaching mlforecast. The minimum must be >= horizon so
# every value used at a forecast date is already observed at the cutoff.
covariate_lags: [14, 28, 56, 90] # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio

# Covariate columns (by name prefix) hidden from the model; same option as the TCN.
drop_covariates: []

xgb_params:
  # Search space and trials: reports/tuning/xgboost_trials.csv (code: commit b87533d).
  n_estimators: 300 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  learning_rate: 0.0133 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  # Interaction depth (XGBoost default).
  max_depth: 5 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  # Row/column subsampling and regularisation reduce overfitting.
  subsample: 0.9246 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  colsample_bytree: 0.7551 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  min_child_weight: 13.704 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  reg_lambda: 1.5413 # ajustado con Optuna: 20 pruebas, ventanas de ajuste 2020, datos 2009-2024, objetivo rel_mae medio
  # Histogram split finding: fast on ~37k rows; fixed seed for reproducibility.
  tree_method: hist
  random_state: 42
  n_jobs: -1
